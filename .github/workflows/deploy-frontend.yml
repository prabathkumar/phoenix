name: Deploy frontend to GitHub Pages

# Publishes frontend/index.html (the tester-facing recording UI) as a
# static page at https://<owner>.github.io/<repo>/ so it has a stable
# public URL instead of "cd into the repo and run a local server".
#
# Important: this only publishes the STATIC page. It still connects, in
# the tester's own browser, to a TestOps Mobile backend (run-session.js's
# live-view WebSocket) running locally on whatever machine has the
# emulator/Appium/device — see README.md's "Public frontend URL" section.
# ws://localhost:<port> from this https-hosted page works fine because
# browsers treat localhost as a secure-context exception; a backend on a
# different machine needs a tunnel (ngrok, etc.) passed via ?host=.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp frontend/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
