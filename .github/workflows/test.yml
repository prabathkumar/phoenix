name: Test

# Runs every package's test suite on every push and PR. capture/ and
# generation/'s suites caught two real bugs found from live device runs
# (ambiguous list-row selectors, text-only assertion diffing); engine/'s
# and live-view/'s suites (added later) caught real bugs the same way —
# a crashing session on an unfocused iOS field, a broken WDA typing path
# — against fake drivers/recorders rather than needing a real device in
# CI. frontend/'s suite (added with the direct-upload flow) covers
# upload-session.js's platform detection and error handling the same
# way, against a real HTTP server + real multipart parsing but faked
# session-manager/browserstack-upload/remote-provider — no real
# BrowserStack account or Appium session needed in CI either. Catching
# a regression here is a lot cheaper than catching it on a laptop
# mid-recording against a real emulator or Simulator.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [capture, generation, engine, live-view, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ${{ matrix.package }} dependencies
        working-directory: ${{ matrix.package }}
        run: npm install

      - name: Run ${{ matrix.package }} tests
        working-directory: ${{ matrix.package }}
        run: npm test
