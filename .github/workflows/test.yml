name: Test

# Runs every package's test suite on every push and PR. capture/ and
# generation/'s suites caught two real bugs found from live device runs
# (ambiguous list-row selectors, text-only assertion diffing); engine/'s
# and live-view/'s suites (added later) caught real bugs the same way —
# a crashing session on an unfocused iOS field, a broken WDA typing path
# — against fake drivers/recorders rather than needing a real device in
# CI. frontend/'s suite (added with the direct-upload flow) covers
# upload-session.js's platform detection and error handling the same
# way, against a real HTTP server + real multipart parsing but faked
# session-manager/browserstack-upload/remote-provider — no real
# BrowserStack account or Appium session needed in CI either. Catching
# a regression here is a lot cheaper than catching it on a laptop
# mid-recording against a real emulator or Simulator.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [capture, generation, engine, live-view, frontend, root]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Bumped from 20 to 22 -- real CI failure (run 167, test (engine)):
          # engine/test/locator-store.test.js requires node:sqlite, which
          # doesn't exist before Node 22.5 -- same root cause as the
          # Dockerfile's node:20.18.1-slim -> node:22.23.3-slim bump (see
          # docs/STATUS.md's addons-run-ios-docker-16.log entry). 22 is the
          # current Node.js LTS line.
          node-version: 22

      # "root" isn't a real package (no package.json, no npm install) --
      # it's test/*.test.js at the repo root (check-env.js, run-batch-
      # executions.js), run directly with node. Every other entry is a
      # real subproject with its own package.json.
      - name: Install ${{ matrix.package }} dependencies
        if: matrix.package != 'root'
        working-directory: ${{ matrix.package }}
        run: npm install

      # engine/ and the root-level run-batch-executions.js both cross-
      # require generation/*.js directly (auto-heal.js, semantic-act-
      # executor.js, session-manager.js, semantic-snapshot.js) rather than
      # depending on it as a published package, so generation's own
      # dependencies (e.g. @xmldom/xmldom) must physically exist under
      # generation/node_modules for those requires to resolve -- Node
      # resolves a module relative to the FILE doing the requiring, not
      # the package that ends up running it. Each matrix job otherwise
      # only installs its own directory, so this was silently relying on
      # generation/node_modules already being present locally and broke
      # on a clean checkout.
      - name: Install generation dependencies (engine/root cross-require generation/*.js)
        if: matrix.package == 'engine' || matrix.package == 'root'
        working-directory: generation
        run: npm install

      # Real CI failure found 2026-10-04 (the "Record this step" wiring):
      # frontend/record-step-endpoint.js cross-requires capture/recorder.js
      # for real (unlike engine/attach-session.js and live-view/server.js,
      # which frontend/test/record-step-endpoint.test.js fakes via
      # require.cache BEFORE requiring the endpoint, so their real
      # dependencies -- webdriverio, ws -- are never actually loaded).
      # capture/recorder.js is NOT faked, so its real dependency
      # (@xmldom/xmldom) must physically exist under capture/node_modules
      # for that require to resolve -- same root cause as the existing
      # generation-for-engine install step above, just one package over.
      - name: Install capture dependencies (frontend cross-requires capture/recorder.js)
        if: matrix.package == 'frontend'
        working-directory: capture
        run: npm install

      - name: Run ${{ matrix.package }} tests
        if: matrix.package != 'root'
        working-directory: ${{ matrix.package }}
        run: npm test

      - name: Run root tests (test/*.test.js)
        if: matrix.package == 'root'
        run: node test/check-env.test.js && node test/run-batch-executions.test.js
