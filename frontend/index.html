<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phoenix — Record a flow</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa0ab;
    --accent: #ff5a36; /* phoenix orange */
    --accent-dim: #7a2e1c;
    --ok: #3ddc84;
    --danger: #ff5f56;
    --mono: "SF Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  .status {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
  }
  .dot.connected { background: var(--ok); }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .device-pane {
    flex: 0 0 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .device-frame {
    position: relative;
    width: 100%;
    max-width: 380px;
    border: 8px solid #23262e;
    border-radius: 28px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .device-frame img {
    display: block;
    width: 100%;
    cursor: crosshair;
    user-select: none;
  }
  .device-frame .placeholder {
    aspect-ratio: 9 / 19.5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }
  .tap-marker {
    position: absolute;
    width: 28px;
    height: 28px;
    margin: -14px 0 0 -14px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    animation: pulse 0.6s ease-out;
  }
  @keyframes pulse {
    from { transform: scale(0.4); opacity: 1; }
    to { transform: scale(1.6); opacity: 0; }
  }

  .controls {
    width: 100%;
    max-width: 380px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .type-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent); }
  button {
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:hover:not(:disabled) { opacity: 0.85; }
  .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #1a1a1a; }
  .btn-primary { background: var(--accent); color: #1a1a1a; }

  .side-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .steps-panel {
    flex: 0 0 auto;
    max-height: 40%;
    overflow-y: auto;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .steps-panel h2, .script-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .step-row {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .step-row:last-child { border-bottom: none; }
  .step-index {
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
    width: 22px;
    flex-shrink: 0;
  }
  .step-detail code {
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  .empty-hint { color: var(--muted); font-size: 13px; }

  .script-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    min-height: 0;
  }
  .script-panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .script-panel-header h2 { margin: 0; }
  pre#script-output {
    flex: 1;
    margin: 10px 0 0;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre;
  }
</style>
</head>
<body>

<header>
  <h1><span>Phoenix</span> — Record a flow</h1>
  <div class="status">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-label">Connecting…</span>
  </div>
</header>

<main>
  <section class="device-pane">
    <div class="device-frame" id="device-frame">
      <div class="placeholder" id="placeholder">Waiting for the device...</div>
    </div>

    <div class="controls">
      <div class="type-row">
        <input type="text" id="type-input" placeholder="Type into the focused field, then press Enter" />
        <button class="btn-secondary" id="type-btn">Type</button>
      </div>
      <button class="btn-danger" id="stop-btn" disabled>Stop &amp; Generate Script</button>
    </div>
  </section>

  <section class="side-pane">
    <div class="steps-panel">
      <h2>Recorded steps</h2>
      <div id="steps-list"><p class="empty-hint">Tap the device above to start recording.</p></div>
    </div>
    <div class="script-panel">
      <div class="script-panel-header">
        <h2>Generated script</h2>
        <button class="btn-secondary" id="copy-btn" style="margin-left:auto; display:none;">Copy</button>
      </div>
      <pre id="script-output">// Generated script will appear here once you stop recording.</pre>
    </div>
  </section>
</main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const host = params.get("host") || "localhost"; // override with ?host=... to point at a tunnel (e.g. ngrok) instead of your own machine
  const port = params.get("port") || "8090";
  const wsUrl = "ws://" + host + ":" + port;

  const connDot = document.getElementById("conn-dot");
  const connLabel = document.getElementById("conn-label");
  const deviceFrame = document.getElementById("device-frame");
  const placeholder = document.getElementById("placeholder");
  const stopBtn = document.getElementById("stop-btn");
  const typeInput = document.getElementById("type-input");
  const typeBtn = document.getElementById("type-btn");
  const stepsList = document.getElementById("steps-list");
  const scriptOutput = document.getElementById("script-output");
  const copyBtn = document.getElementById("copy-btn");

  let img = null;
  let stepCount = 0;
  let stopped = false;

  const socket = new WebSocket(wsUrl);

  function setConnected(connected, label) {
    connDot.classList.toggle("connected", connected);
    connLabel.textContent = label;
  }

  socket.addEventListener("open", () => {
    setConnected(true, "Connected — waiting for the first frame");
  });

  socket.addEventListener("close", () => {
    setConnected(false, stopped ? "Session finished" : "Disconnected");
    stopBtn.disabled = true;
  });

  socket.addEventListener("error", () => {
    setConnected(false, "Connection error — is run-session.js running on port " + port + "?");
  });

  socket.addEventListener("message", (event) => {
    const message = JSON.parse(event.data);

    if (message.type === "frame") {
      renderFrame(message.screenshotBase64);
      setConnected(true, "Live");
      stopBtn.disabled = false;
    }

    if (message.type === "step-recorded") {
      stepCount = message.stepIndex + 1;
      addStepRow(stepCount, "tap");
    }

    if (message.type === "text-entered") {
      addStepRow(message.stepIndex + 1, "type", typeInput.value);
      typeInput.value = "";
    }

    if (message.type === "session-finished") {
      setConnected(true, "Generating script…");
      stopBtn.disabled = true;
    }

    if (message.type === "script-generated") {
      stopped = true;
      scriptOutput.textContent = message.scriptSource;
      copyBtn.style.display = "inline-block";
      setConnected(true, "Done — \"" + message.testName + "\" (" + message.assertionCount + " assertion(s))");
    }

    if (message.type === "generation-failed") {
      setConnected(false, "Generation failed: " + message.message);
    }

    if (message.type === "type-error") {
      // Server rejected this keystroke (e.g. typed before any tap was
      // recorded) — surface why instead of leaving the tester wondering
      // where their text went. Deliberately doesn't clear typeInput.value
      // or the connection status's "Live" state: the session is fine,
      // this one action just didn't have a step to attach to yet.
      setConnected(true, message.message || "Couldn't record that text entry.");
    }
  });

  function renderFrame(base64) {
    if (!img) {
      placeholder.remove();
      img = document.createElement("img");
      img.addEventListener("click", onDeviceClick);
      deviceFrame.appendChild(img);
    }
    img.src = "data:image/png;base64," + base64;
  }

  function onDeviceClick(event) {
    if (stopped) return;
    const rect = img.getBoundingClientRect();
    const xRatio = (event.clientX - rect.left) / rect.width;
    const yRatio = (event.clientY - rect.top) / rect.height;

    showTapMarker(event.clientX - rect.left, event.clientY - rect.top);
    send({ type: "tap", xRatio, yRatio });
  }

  function showTapMarker(x, y) {
    const marker = document.createElement("div");
    marker.className = "tap-marker";
    marker.style.left = x + "px";
    marker.style.top = y + "px";
    deviceFrame.appendChild(marker);
    setTimeout(() => marker.remove(), 600);
  }

  function addStepRow(index, kind, typedValue) {
    if (stepsList.querySelector(".empty-hint")) stepsList.innerHTML = "";
    const row = document.createElement("div");
    row.className = "step-row";
    const detail = kind === "type"
      ? "Typed <code>" + escapeHtml(typedValue || "") + "</code>"
      : "Tapped an element";
    row.innerHTML = '<span class="step-index">' + index + '</span><span class="step-detail">' + detail + "</span>";
    stepsList.appendChild(row);
    stepsList.scrollTop = stepsList.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function send(message) {
    if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  typeBtn.addEventListener("click", submitType);
  typeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitType();
  });
  function submitType() {
    const value = typeInput.value;
    if (!value) return;
    send({ type: "type", value });
  }

  stopBtn.addEventListener("click", () => {
    stopBtn.disabled = true;
    send({ type: "stop" });
  });

  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(scriptOutput.textContent).then(() => {
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
    });
  });
})();
</script>

</body>
</html>
