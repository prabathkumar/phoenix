<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestOps ai-automate — Web recorder</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --text:#e8ecf6; --muted:#8c97b3; --accent:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  #dot.on { background:var(--ok); }
  #start { margin:auto; width:min(560px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; }
  #start h2 { margin:0 0 6px; font-size:20px; }
  #start p { color:var(--muted); margin:0 0 18px; }
  input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0c111b; color:var(--text); font-size:14px; }
  button { padding:9px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  #err { color:var(--bad); margin-top:10px; min-height:1.2em; }
  #main { display:none; flex:1; min-height:0; }
  #stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; background:radial-gradient(circle at 50% 40%, #1b2440, var(--bg) 70%); }
  #browser { width:100%; max-width:1100px; background:#0c111b; border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  #bar { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar .lights span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; background:#3a4562; }
  #url { flex:1; }
  #viewport { position:relative; aspect-ratio:1280/800; background:#fff; cursor:crosshair; }
  #viewport img { width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#667; }
  .ping { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:2px solid var(--accent); animation:ping .6s ease-out forwards; pointer-events:none; }
  @keyframes ping { to { transform:scale(2.2); opacity:0; } }
  #side { width:420px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .block { padding:12px 14px; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  #steps { flex:1; min-height:80px; overflow:auto; padding:8px 14px; }
  .step { padding:7px 9px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
  .step small { display:block; color:var(--muted); }
  #script { height:30%; margin:0; padding:12px 14px; overflow:auto; background:#0c111b; font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre; border-top:1px solid var(--line); }
  #status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><span id="dot"></span><h1>TestOps ai-automate</h1><span class="sub">Web recorder</span><span id="status" style="margin-left:auto"></span></header>

<section id="start">
  <h2>Record a web flow</h2>
  <p>Enter the page to start from. Then click and type in the browser exactly like a user — each action becomes a test step.</p>
  <input id="start-url" type="text" placeholder="https://example.com" value="https://example.com" autofocus>
  <div class="row" style="margin-top:14px"><button id="start-btn">Start recording</button></div>
  <div id="err"></div>
</section>

<main id="main">
  <div id="stage">
    <div id="browser">
      <div id="bar"><div class="lights"><span></span><span></span><span></span></div>
        <input id="url" type="text" placeholder="Enter a URL and press Enter"></div>
      <div id="viewport"><div id="hint">Starting browser…</div></div>
    </div>
  </div>
  <aside id="side">
    <div class="block">
      <div class="row"><button id="stop-btn" class="danger">Stop &amp; generate</button><button class="ghost" id="up">Scroll ↑</button><button class="ghost" id="down">Scroll ↓</button></div>
    </div>
    <div class="block">
      <div class="row"><input id="type-input" type="text" placeholder="Click a field, then type here"><button id="type-btn">Type</button><button class="ghost" id="enter-btn" title="Press Enter in the field (submits most forms)">Enter ↵</button></div>
    </div>
    <div id="steps"></div>
    <div class="block row" id="outbar" style="display:none"><button id="copy-script">Copy script</button><button class="ghost" id="copy-json">Copy test-case JSON</button></div>
    <pre id="script" style="display:none"></pre>
  </aside>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const host = location.hostname || "localhost";
  let socket, stopped = false, last = null;

  $("start-btn").addEventListener("click", start);
  $("start-url").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

  async function start() {
    $("err").textContent = ""; $("start-btn").disabled = true;
    try {
      const res = await fetch("/api/web-sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("start-url").value.trim() }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to start");
      $("start").style.display = "none"; $("main").style.display = "flex";
      connect(data.port);
    } catch (e) { $("err").textContent = e.message; $("start-btn").disabled = false; }
  }

  const send = (m) => { if (socket && socket.readyState === 1) socket.send(JSON.stringify(m)); };

  function connect(port) {
    socket = new WebSocket("ws://" + host + ":" + port);
    socket.addEventListener("open", () => $("dot").classList.add("on"));
    socket.addEventListener("close", () => { $("dot").classList.remove("on"); if (!stopped) $("status").textContent = "Disconnected"; });
    socket.addEventListener("message", (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === "frame") frame(m.screenshotBase64);
      else if (m.type === "page") { if (document.activeElement !== $("url")) $("url").value = m.url; }
      else if (m.type === "step") { addStep(m); $("status").textContent = ""; }
      else if (m.type === "error") $("status").textContent = m.message;
      else if (m.type === "busy") $("status").textContent = "Still working on the last action…";
      else if (m.type === "stopped") finish(m);
    });
  }

  function frame(b64) {
    let img = last;
    if (!img) {
      $("hint").remove();
      img = last = document.createElement("img");
      img.draggable = false;
      img.addEventListener("click", (e) => {
        const r = img.getBoundingClientRect();
        const xr = (e.clientX - r.left) / r.width, yr = (e.clientY - r.top) / r.height;
        ping(e.clientX - r.left, e.clientY - r.top);
        send({ type: "click", xRatio: xr, yRatio: yr });
      });
      img.addEventListener("wheel", (e) => { e.preventDefault(); send({ type: "scroll", direction: e.deltaY < 0 ? "up" : "down" }); }, { passive: false });
      $("viewport").appendChild(img);
    }
    img.src = "data:image/jpeg;base64," + b64;
  }

  function ping(x, y) {
    const d = document.createElement("div"); d.className = "ping"; d.style.left = x + "px"; d.style.top = y + "px";
    $("viewport").appendChild(d); setTimeout(() => d.remove(), 700);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function addStep(m) {
    let el = document.querySelector('[data-i="' + m.index + '"]');
    if (!el) { el = document.createElement("div"); el.className = "step"; el.dataset.i = m.index; $("steps").appendChild(el); }
    const sel = m.step.selector ? m.step.selector.strategy + ": " + m.step.selector.value : "";
    el.innerHTML = "<b>" + (Number(m.index) + 1) + ".</b> " + esc(m.step.instruction || m.step.kind) + (sel ? "<small>" + esc(sel) + "</small>" : "");
    $("steps").scrollTop = $("steps").scrollHeight;
  }

  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") send({ type: "navigate", url: $("url").value }); });
  $("up").addEventListener("click", () => send({ type: "scroll", direction: "up" }));
  $("down").addEventListener("click", () => send({ type: "scroll", direction: "down" }));
  const typeNow = () => send({ type: "type", text: $("type-input").value });
  $("type-btn").addEventListener("click", typeNow);
  $("type-input").addEventListener("keydown", (e) => { if (e.key === "Enter") typeNow(); });
  $("enter-btn").addEventListener("click", () => { if ($("type-input").value) typeNow(); send({ type: "press", key: "Enter" }); });
  $("stop-btn").addEventListener("click", () => { $("stop-btn").disabled = true; send({ type: "stop" }); });

  let out = null;
  function finish(m) {
    stopped = true; out = m;
    $("script").style.display = "block"; $("script").textContent = m.script;
    $("outbar").style.display = "flex"; $("status").textContent = m.steps.length + " step(s) recorded";
  }
  const copy = (t) => navigator.clipboard && navigator.clipboard.writeText(t);
  $("copy-script").addEventListener("click", () => out && copy(out.script));
  $("copy-json").addEventListener("click", () => out && copy(JSON.stringify(out.testCase, null, 2)));
})();
</script>
</body>
</html>
